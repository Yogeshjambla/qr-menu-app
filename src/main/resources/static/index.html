<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu QR Code System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-success">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <i class="fas fa-utensils me-2"></i>Food Menu QR
                </a>
                <div class="navbar-nav ms-auto">
                    <button class="btn btn-outline-light" onclick="showLogin()">Admin Login</button>
                </div>
            </div>
        </nav>

        <!-- Login Modal -->
        <div class="modal fade" id="loginModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Admin Login</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="container-fluid py-4">
            <!-- Customer Menu View -->
            <div id="customerView" class="row">
                <div class="col-12">
                    <div class="text-center mb-4">
                        <h1 class="display-4">Restaurant Menu</h1>
                        <p class="lead">Scan QR code to view our delicious menu</p>
                    </div>
                    
                    <!-- Categories -->
                    <div id="categories" class="mb-4">
                        <h3>Categories</h3>
                        <div class="row" id="categoryList"></div>
                    </div>

                    <!-- Menu Items -->
                    <div id="menuItems">
                        <h3>Menu Items</h3>
                        <div class="row" id="menuItemList"></div>
                    </div>

                    <!-- Cart -->
                    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1000;">
                        <button class="btn btn-warning btn-lg rounded-circle position-relative" onclick="toggleCart()">
                            <i class="fas fa-shopping-cart"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartCount">0</span>
                        </button>
                    </div>

                    <!-- Cart Sidebar -->
                    <div class="offcanvas offcanvas-end" id="cartSidebar">
                        <div class="offcanvas-header">
                            <h5 class="offcanvas-title">Your Cart</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                        </div>
                        <div class="offcanvas-body">
                            <div id="cartItems"></div>
                            <div class="mt-3">
                                <h5>Total: $<span id="cartTotal">0.00</span></h5>
                                <button class="btn btn-success w-100" onclick="placeOrder()">Place Order</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Admin Dashboard -->
            <div id="adminView" class="d-none">
                <div class="row">
                    <div class="col-12">
                        <h1>Admin Dashboard</h1>
                        <button class="btn btn-secondary mb-3" onclick="logout()">Logout</button>
                    </div>
                </div>

                <!-- Dashboard Stats -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card bg-primary text-white">
                            <div class="card-body">
                                <h5 class="card-title">Categories</h5>
                                <h2 id="categoryCount">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-success text-white">
                            <div class="card-body">
                                <h5 class="card-title">Menu Items</h5>
                                <h2 id="menuItemCount">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-info text-white">
                            <div class="card-body">
                                <h5 class="card-title">Tables</h5>
                                <h2 id="tableCount">0</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-warning text-white">
                            <div class="card-body">
                                <h5 class="card-title">Orders</h5>
                                <h2 id="orderCount">0</h2>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Admin Tabs -->
                <ul class="nav nav-tabs" id="adminTabs">
                    <li class="nav-item">
                        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#menuTab">Menu Items</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#categoryTab">Categories</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tableTab">Tables</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#orderTab">Orders</button>
                    </li>
                </ul>

                <div class="tab-content" id="adminTabContent">
                    <!-- Menu Management -->
                    <div class="tab-pane fade show active" id="menuTab">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between">
                                <h5>Menu Items</h5>
                                <button class="btn btn-primary" onclick="showAddMenuItem()">Add Item</button>
                            </div>
                            <div class="card-body">
                                <div id="adminMenuItems"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Category Management -->
                    <div class="tab-pane fade" id="categoryTab">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between">
                                <h5>Categories</h5>
                                <button class="btn btn-primary" onclick="showAddCategory()">Add Category</button>
                            </div>
                            <div class="card-body">
                                <div id="adminCategories"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Table Management -->
                    <div class="tab-pane fade" id="tableTab">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between">
                                <h5>Tables</h5>
                                <button class="btn btn-primary" onclick="showAddTable()">Add Table</button>
                            </div>
                            <div class="card-body">
                                <div id="adminTables"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Order Management -->
                    <div class="tab-pane fade" id="orderTab">
                        <div class="card">
                            <div class="card-header">
                                <h5>Orders</h5>
                            </div>
                            <div class="card-body">
                                <div id="adminOrders"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div class="modal fade" id="menuItemModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Menu Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="menuItemForm">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="itemName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="itemDescription" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <input type="number" step="0.01" class="form-control" id="itemPrice" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-control" id="itemCategory" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Image</label>
                            <input type="file" class="form-control" id="itemImage" accept="image/*">
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="itemAvailable" checked>
                            <label class="form-check-label">Available</label>
                        </div>
                        <button type="submit" class="btn btn-success">Save Item</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="categoryForm">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="categoryName" required>
                        </div>
                        <button type="submit" class="btn btn-success">Save Category</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="tableModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Table</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="tableForm">
                        <div class="mb-3">
                            <label class="form-label">Table Name</label>
                            <input type="text" class="form-control" id="tableName" required>
                        </div>
                        <button type="submit" class="btn btn-success">Save Table</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
